<div class="tab-section">
  <div class="field-row">
    <label>Name <input id="charName" type="text" placeholder="Hero name" style="min-width:180px"></label>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <div class="info-label">Level</div>
      <div class="info-value" id="levelSpan">1</div>
    </div>
    <div class="info-card">
      <div class="info-label">Prof Bonus</div>
      <div class="info-value" id="profSpan2">+2</div>
    </div>
    <div class="info-card">
      <div class="info-label">Max Blood</div>
      <div class="info-value" id="maxBloodSpan">8</div>
    </div>
    <div class="info-card">
      <div class="info-label">AC</div>
      <div class="info-value" id="acSpan2">10</div>
    </div>
    <div class="info-card">
      <div class="info-label">Save DC</div>
      <div class="info-value" id="saveDcSpan2">10</div>
    </div>
    <div class="info-card">
      <div class="info-label">Speed</div>
      <div class="info-value" id="speedSpan">30</div>
    </div>
  </div>

  <hr class="divider">

  <div class="section-title">Experience</div>
  <div class="field-row">
    <span>XP: <strong id="xpDisplay">0</strong></span>
    <label>Add XP <input id="xpAddInput" type="number" step="1" min="0" class="small" placeholder="0"></label>
    <button id="btnAddXp" class="primary">Add XP</button>
  </div>

  <hr class="divider">

  <div class="section-title">Recovery Dice (<span id="hdDieSpan">d8</span>)</div>
  <div class="field-row">
    <span>Available: <strong id="hdAvailSpan">1</strong> / <strong id="hdMaxSpan">1</strong></span>
  </div>

  <hr class="divider">

  <div class="section-title">Adjustments</div>
  <div class="field-row wrap">
    <label>Speed <input id="baseSpeedInput" type="number" step="5" min="0" class="small" value="30"></label>
    <label>Blood bonus/penalty <input id="homebrewHp" type="number" step="1" class="small" placeholder="0"></label>
    <label>Perm HP adjust <input id="hpAdjustInput" type="number" step="1" class="small" value="0"></label>
    <label class="checkbox-label"><input id="toughChk" type="checkbox"> Tough (+2 per level)</label>
  </div>

  <hr class="divider">

  <div class="section-title">Attack &amp; Defence Magic Bonuses</div>
  <div class="field-row wrap">
    <label>Melee stat
      <select id="meleeStatSelect">
        <option value="str">STR</option>
        <option value="dex">DEX</option>
      </select>
    </label>
    <label>Melee magic <input id="meleeMagicInput" type="number" step="1" class="small" value="0"></label>
    <label>Ranged magic <input id="rangedMagicInput" type="number" step="1" class="small" value="0"></label>
    <label>AC magic <input id="acMagicInput" type="number" step="1" class="small" value="0"></label>
  </div>

  <hr class="divider">

  <div class="section-title">Ability Save DC</div>
  <div class="field-row wrap">
    <label>Ability
      <select id="saveDcStatSelect">
        <option value="str">STR</option>
        <option value="dex">DEX</option>
        <option value="con">CON</option>
        <option value="int_">INT</option>
        <option value="wis">WIS</option>
        <option value="cha">CHA</option>
      </select>
    </label>
    <label>Magic bonus <input id="saveDcMagicInput" type="number" step="1" class="small" value="0"></label>
    <span>DC: <strong id="saveDcDetail">10</strong></span>
  </div>
</div>
