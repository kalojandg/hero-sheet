<div class="tab-section">
  <div class="section-title">Ability Scores</div>
  <table class="data-table ability-table">
    <thead>
      <tr><th>Ability</th><th>Score</th><th>Mod</th><th>Prof?</th><th>Save</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>STR</td>
        <td><input id="strInput" type="number" class="score-input" value="10"></td>
        <td id="strModSpan">+0</td>
        <td><input type="checkbox" id="saveStrProf"></td>
        <td id="saveStrTotalSpan">+0</td>
      </tr>
      <tr>
        <td>DEX</td>
        <td><input id="dexInput" type="number" class="score-input" value="10"></td>
        <td id="dexModSpan">+0</td>
        <td><input type="checkbox" id="saveDexProf"></td>
        <td id="saveDexTotalSpan">+0</td>
      </tr>
      <tr>
        <td>CON</td>
        <td><input id="conInput" type="number" class="score-input" value="10"></td>
        <td id="conModSpan">+0</td>
        <td><input type="checkbox" id="saveConProf"></td>
        <td id="saveConTotalSpan">+0</td>
      </tr>
      <tr>
        <td>INT</td>
        <td><input id="intInput" type="number" class="score-input" value="10"></td>
        <td id="intModSpan">+0</td>
        <td><input type="checkbox" id="saveIntProf"></td>
        <td id="saveIntTotalSpan">+0</td>
      </tr>
      <tr>
        <td>WIS</td>
        <td><input id="wisInput" type="number" class="score-input" value="10"></td>
        <td id="wisModSpan">+0</td>
        <td><input type="checkbox" id="saveWisProf"></td>
        <td id="saveWisTotalSpan">+0</td>
      </tr>
      <tr>
        <td>CHA</td>
        <td><input id="chaInput" type="number" class="score-input" value="10"></td>
        <td id="chaModSpan">+0</td>
        <td><input type="checkbox" id="saveChaProf"></td>
        <td id="saveChaTotalSpan">+0</td>
      </tr>
    </tbody>
  </table>

  <div class="field-row" style="margin-top:12px">
    <label>Save All Bonus <input id="saveAllBonusInput" type="number" step="1" class="small" value="0"></label>
  </div>
</div>
